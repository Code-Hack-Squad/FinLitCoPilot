name: Deploy FinLit Co-Pilot to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and export static Next.js site
        env:
          NODE_ENV: production
          GITHUB_PAGES: 'true'
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build
          # Ensure .nojekyll exists so GitHub Pages does not ignore _next assets
          touch ./out/.nojekyll
          # Ensure 404 fallback exists for client-side routing
          if [ -f ./out/index.html ] && [ ! -f ./out/404.html ]; then
            cp ./out/index.html ./out/404.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
